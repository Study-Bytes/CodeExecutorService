server.port=${SERVER_PORT:8084}

# Чтобы JSON был читаемее
spring.jackson.serialization.indent_output=true

# Actuator (если понадобится)
management.endpoints.web.exposure.include=health,info

# Warm Python containers for /executions/opt-batch.
executor.python.warm-pool.enabled=${EXECUTOR_PYTHON_WARM_POOL_ENABLED:true}
executor.python.warm-pool.size=${EXECUTOR_PYTHON_WARM_POOL_SIZE:3}
executor.python.warm-pool.memory-limit-mb=${EXECUTOR_PYTHON_WARM_POOL_MEMORY_LIMIT_MB:256}
executor.python.warm-pool.acquire-timeout-ms=${EXECUTOR_PYTHON_WARM_POOL_ACQUIRE_TIMEOUT_MS:30000}
