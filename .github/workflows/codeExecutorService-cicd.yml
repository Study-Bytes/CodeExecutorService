name: CodeExecutorService CI/CD

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - '**'

permissions:
  contents: read

concurrency:
  group: code-executor-service-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Build, test, OpenAPI and Docker check
    runs-on: ubuntu-latest

    env:
      SERVER_PORT: 8095

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x ./mvnw

      - name: Run tests
        run: ./mvnw -B clean verify

      - name: Validate OpenAPI contract
        run: |
          if [ -f openapi.yml ]; then
            ruby -e "require 'yaml'; YAML.load_file('openapi.yml')"
          elif [ -f openapi.yaml ]; then
            ruby -e "require 'yaml'; YAML.load_file('openapi.yaml')"
          else
            echo "OpenAPI contract file is missing. Expected openapi.yml or openapi.yaml in repo root."
            exit 1
          fi

      - name: Check OpenAPI contract is committed
        run: |
          if [ -f openapi.yml ]; then
            git diff --exit-code openapi.yml
          elif [ -f openapi.yaml ]; then
            git diff --exit-code openapi.yaml
          else
            echo "OpenAPI contract file is missing. Expected openapi.yml or openapi.yaml in repo root."
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: studybytes/code-executor-service:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy CodeExecutorService to VPS
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    environment:
      name: production

    steps:
      - name: Validate required deployment secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_DEPLOY_BASE_PATH: ${{ secrets.VPS_DEPLOY_BASE_PATH }}
        run: |
          test -n "$VPS_HOST" || (echo "VPS_HOST secret is missing" && exit 1)
          test -n "$VPS_PORT" || (echo "VPS_PORT secret is missing" && exit 1)
          test -n "$VPS_USER" || (echo "VPS_USER secret is missing" && exit 1)
          test -n "$VPS_SSH_KEY" || (echo "VPS_SSH_KEY secret is missing" && exit 1)
          test -n "$VPS_DEPLOY_BASE_PATH" || (echo "VPS_DEPLOY_BASE_PATH secret is missing" && exit 1)

      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/code-executor-service_deploy_key
          chmod 600 ~/.ssh/code-executor-service_deploy_key
          ssh-keyscan -p "$VPS_PORT" "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Deploy over SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_DEPLOY_BASE_PATH: ${{ secrets.VPS_DEPLOY_BASE_PATH }}
          VPS_HEALTHCHECK_URL: ${{ secrets.VPS_HEALTHCHECK_URL }}
        run: |
          DEPLOY_SERVICE_DIR="code-executor-service"
          HEALTHCHECK_URL="${VPS_HEALTHCHECK_URL:-http://127.0.0.1:8095/actuator/health}"
          ssh -i ~/.ssh/code-executor-service_deploy_key -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
            "set -euo pipefail
             DEPLOY_PATH='${VPS_DEPLOY_BASE_PATH%/}/$DEPLOY_SERVICE_DIR'
             if [ ! -d \"\$DEPLOY_PATH/.git\" ]; then
               mkdir -p \"\$DEPLOY_PATH\"
               git clone 'https://github.com/${{ github.repository }}.git' \"\$DEPLOY_PATH\"
             fi
             cd \"\$DEPLOY_PATH\"
             git config --global --add safe.directory \"\$DEPLOY_PATH\"
             git fetch origin main
             git checkout main
             git pull --ff-only origin main
             if [ ! -f .env ]; then
               if [ -f .env.example ]; then
                 cp .env.example .env
               else
                 touch .env
               fi
             fi
             docker compose up -d --build
             docker compose ps
             for attempt in \$(seq 1 40); do
               if curl -fsS '$HEALTHCHECK_URL'; then
                 exit 0
               fi
               echo \"Waiting for CodeExecutorService health check... attempt \$attempt/40\"
               sleep 3
             done
             docker compose logs --tail=200 code-executor-service
             exit 1"
